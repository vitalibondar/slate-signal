# ~/.config/hypr/ (sourced snippet) — MACHINE-LEVEL, THEME-INDEPENDENT geometry.
# Border COLORS are generated per-theme from colors.toml (active = accent,
# inactive = neutral); only width and rounding live here and stay constant
# across Day/Night.

general {
    border_size = 3          # 2->3: active window unmistakable at a glance
    gaps_in = 5
    gaps_out = 10
    # col.active_border / col.inactive_border are set by the Omarchy theme.
}

decoration {
    rounding = 0             # square corners give each border its full,
                            # unambiguous length; rounding eats the corners
                            # that tell you where a window ends.
}
